];

    const MARKET_SYMBOLS = ["SPY","QQQ","IWM"];

    // =============================
    // HELPERS
    // =============================
    function fmt1(n){ return Number.isFinite(n) ? n.toFixed(1) : "—"; }
    function fmt2(n){ return Number.isFinite(n) ? n.toFixed(2) : "—"; }

    function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

    function sanitizeTicker(s){
      s = String(s||"").trim().toUpperCase();
      return s.startsWith("$") ? s.slice(1) : s;
    }

    async function fetchJson(url){
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // =============================
    // API FMP
    // =============================
    async function fetchQuote(symbol){
      const url = `https://financialmodelingprep.com/stable/quote?symbol=${encodeURIComponent(symbol)}&apikey=${API_KEY}`;
      const data = await fetchJson(url);
      return Array.isArray(data) ? data[0] : null;
    }

    async function fetchDailyHistory(symbol){
      const url = `https://financialmodelingprep.com/stable/historical-price-eod/full?symbol=${encodeURIComponent(symbol)}&apikey=${API_KEY}`;
      const data = await fetchJson(url);
      let rows = [];
      if (Array.isArray(data)) rows = data;
      else if (Array.isArray(data?.historical)) rows = data.historical;
      else if (Array.isArray(data?.prices)) rows = data.prices;
      return rows
        .map(r => ({
          date: r.date || "",
          close: Number(r.close ?? r.adjClose ?? NaN),
          high: Number(r.high ?? NaN),
          low: Number(r.low ?? NaN),
          volume: Number(r.volume ?? 0)
        }))
        .filter(r => Number.isFinite(r.close))
        .sort((a,b) => String(a.date).localeCompare(String(b.date)));
    }

    async function fetchSymbolBundle(symbol){
      const [quote, history] = await Promise.all([
        fetchQuote(symbol),
        fetchDailyHistory(symbol)
      ]);
      return { symbol, quote, history };
    }

    async function fetchMany(symbols, onProgress){
      const out = [];
      for (let i = 0; i < symbols.length; i++) {
        try {
          const item = await fetchSymbolBundle(symbols[i]);
          out.push(item);
        } catch(e) {
          console.warn("Erreur", symbols[i], e);
        }
        if (onProgress) onProgress(i + 1, symbols.length);
        await delay(130);
      }
      return out;
    }

    // =============================
    // INDICATEURS TECHNIQUES
    // =============================
    function calcEma(values, period){
      if (values.length < period) return [];
      const k = 2 / (period + 1);
      const out = new Array(values.length).fill(NaN);
      let sma = 0;
      for (let i = 0; i < period; i++) sma += values[i];
      sma /= period;
      out[period-1] = sma;
      for (let i = period; i < values.length; i++){
        out[i] = values[i] * k + out[i-1] * (1-k);
      }
      return out;
    }

    function calcSma(values, period){
      const out = new Array(values.length).fill(NaN);
      for (let i = period-1; i < values.length; i++){
        let s = 0;
        for (let j = i-period+1; j <= i; j++) s += values[j];
        out[i] = s / period;
      }
      return out;
    }

    function calcAtr(highs, lows, closes, period){
      const tr = new Array(closes.length).fill(NaN);
      for (let i = 1; i < closes.length; i++){
        tr[i] = Math.max(
          highs[i] - lows[i],
          Math.abs(highs[i] - closes[i-1]),
          Math.abs(lows[i] - closes[i-1])
        );
      }
      // EMA de TR
      const k = 2 / (period + 1);
      const atr = new Array(closes.length).fill(NaN);
      let first = 0, cnt = 0;
      for (let i = 1; i < tr.length; i++){
        if (!isNaN(tr[i])){
          first += tr[i];
          cnt++;
          if (cnt === period){
            atr[i] = first / period;
            for (let j = i+1; j < tr.length; j++){
              atr[j] = tr[j] * k + atr[j-1] * (1-k);
            }
            break;
          }
        }
      }
      return atr;
    }

    function calcAdx(highs, lows, closes, period){
      const plusDM = new Array(closes.length).fill(0);
      const minusDM = new Array(closes.length).fill(0);
      for (let i = 1; i < closes.length; i++){
        const up = highs[i] - highs[i-1];
        const dn = lows[i-1] - lows[i];
        plusDM[i]  = (up > dn && up > 0) ? up : 0;
        minusDM[i] = (dn > up && dn > 0) ? dn : 0;
      }
      const atr = calcAtr(highs, lows, closes, period);
      const k = 2 / (period + 1);

      // EMA des DM
      const pDM = new Array(closes.length).fill(NaN);
      const mDM = new Array(closes.length).fill(NaN);
      // Init avec SMA
      let sp=0, sm=0;
      for (let i = 1; i <= period; i++){ sp += plusDM[i]; sm += minusDM[i]; }
      pDM[period] = sp / period;
      mDM[period] = sm / period;
      for (let i = period+1; i < closes.length; i++){
        pDM[i] = plusDM[i] * k + pDM[i-1] * (1-k);
        mDM[i] = minusDM[i] * k + mDM[i-1] * (1-k);
      }

      const pDI = new Array(closes.length).fill(NaN);
      const mDI = new Array(closes.length).fill(NaN);
      const dx  = new Array(closes.length).fill(NaN);
      for (let i = period; i < closes.length; i++){
        if (!isNaN(atr[i]) && atr[i] > 0){
          pDI[i] = 100 * pDM[i] / atr[i];
          mDI[i] = 100 * mDM[i] / atr[i];
          const sum = pDI[i] + mDI[i];
          dx[i] = sum > 0 ? 100 * Math.abs(pDI[i] - mDI[i]) / sum : 0;
        }
      }

      // EMA du DX = ADX
      const adx = new Array(closes.length).fill(NaN);
      let firstDx = 0, cntDx = 0, startIdx = -1;
      for (let i = 0; i < dx.length; i++){
        if (!isNaN(dx[i])){
          firstDx += dx[i];
          cntDx++;
          if (cntDx === period){
            adx[i] = firstDx / period;
            startIdx = i;
            break;
          }
        }
      }
      if (startIdx >= 0){
        for (let i = startIdx+1; i < dx.length; i++){
          if (!isNaN(dx[i])) adx[i] = dx[i] * k + adx[i-1] * (1-k);
        }
      }

      return { adx, pDI, mDI };
    }

    // ── TTM SQUEEZE ──────────────────────────────────────────────
    function calcSqueeze(closes, highs, lows, bbLen=20, bbMult=2.0, kcLen=20, kcMult=1.5){
      const bb_mid = calcSma(closes, bbLen);
      const stdArr = new Array(closes.length).fill(NaN);
      for (let i = bbLen-1; i < closes.length; i++){
        let mean = bb_mid[i];
        let variance = 0;
        for (let j = i-bbLen+1; j <= i; j++) variance += Math.pow(closes[j]-mean, 2);
        stdArr[i] = Math.sqrt(variance / bbLen);
      }
      const bb_up = bb_mid.map((v,i) => isNaN(v) ? NaN : v + bbMult * stdArr[i]);
      const bb_lo = bb_mid.map((v,i) => isNaN(v) ? NaN : v - bbMult * stdArr[i]);

      const kc_mid = calcEma(closes, kcLen);
      const atr = calcAtr(highs, lows, closes, kcLen);
      const kc_up = kc_mid.map((v,i) => isNaN(v)||isNaN(atr[i]) ? NaN : v + kcMult * atr[i]);
      const kc_lo = kc_mid.map((v,i) => isNaN(v)||isNaN(atr[i]) ? NaN : v - kcMult * atr[i]);

      const sqzOn  = new Array(closes.length).fill(false);
      const sqzOff = new Array(closes.length).fill(false);
      for (let i = 0; i < closes.length; i++){
        if (!isNaN(bb_up[i]) && !isNaN(kc_up[i])){
          sqzOn[i]  = bb_up[i] < kc_up[i] && bb_lo[i] > kc_lo[i];
          sqzOff[i] = bb_up[i] > kc_up[i] && bb_lo[i] < kc_lo[i];
        }
      }
      return { sqzOn, sqzOff };
    }

    function lastFinite(arr){
      for (let i = arr.length-1; i >= 0; i--){
        if (Number.isFinite(arr[i])) return arr[i];
      }
      return NaN;
    }

    function lastFiniteAt(arr, offset){
      let found = 0;
      for (let i = arr.length-1; i >= 0; i--){
        if (Number.isFinite(arr[i])){
          if (found === offset) return arr[i];
          found++;
        }
      }
      return NaN;
    }

    // =============================
    // CALCUL INDICATEURS COMPLET
    // =============================
    function computeIndicators(bundle){
      const q = bundle.quote;
      const hist = bundle.history || [];
      if (!q || hist.length < 210) return null;

      const closes  = hist.map(r => r.close);
      const highs   = hist.map(r => isNaN(r.high)  ? r.close : r.high);
      const lows    = hist.map(r => isNaN(r.low)   ? r.close : r.low);
      const volumes = hist.map(r => r.volume);

      const price   = Number(q.price ?? NaN);
      const prevClose = Number(q.previousClose ?? NaN);
      if (!Number.isFinite(price)) return null;
      if (price < 5) return null;

      // Volume
      const avgVol20 = volumes.slice(-20).reduce((a,b)=>a+b,0) / 20;
      const relVol   = avgVol20 > 0 ? Number(q.volume ?? 0) / avgVol20 : 0;
      if (avgVol20 < 300000) return null;

      // EMAs
      const ema50arr  = calcEma(closes, 50);
      const ema200arr = calcEma(closes, 200);
      const ema50  = lastFinite(ema50arr);
      const ema200 = lastFinite(ema200arr);

      // ADX
      const { adx: adxArr, pDI: pDIarr, mDI: mDIarr } = calcAdx(highs, lows, closes, 14);
      const adxNow  = lastFinite(adxArr);
      const adxPrev = lastFiniteAt(adxArr, 3); // 3 bougies avant
      const pDI     = lastFinite(pDIarr);
      const mDI     = lastFinite(mDIarr);
      const adxFort = Number.isFinite(adxNow) && adxNow >= 20;
      const adxUp   = Number.isFinite(adxNow) && Number.isFinite(adxPrev) && adxNow > adxPrev;

      // Squeeze
      const { sqzOn, sqzOff } = calcSqueeze(closes, highs, lows);
      const n = closes.length;
      const sqzOnNow  = sqzOn[n-1];
      const sqzOffNow = sqzOff[n-1];

      // Sortie fraîche: sqzOff déclenché dans les 3 dernières bougies?
      let sqzFreshExit = false;
      for (let i = Math.max(0, n-3); i < n; i++){
        if (sqzOff[i] && (i === 0 || sqzOn[i-1])) { sqzFreshExit = true; break; }
      }
      // Alternative: les 3 dernières bougies sont en sqzOff et avant c'était sqzOn
      if (!sqzFreshExit){
        let exitCount = 0;
        for (let i = n-1; i >= Math.max(0, n-3); i--){ if (sqzOff[i]) exitCount++; }
        const wasOn = n > 3 && sqzOn[n-4];
        sqzFreshExit = exitCount >= 1 && wasOn;
      }

      const gapPct = Number.isFinite(prevClose) && prevClose > 0
        ? ((price - prevClose) / prevClose) * 100
        : Number(q.changesPercentage ?? 0);

      // ADX catégorie
      let adxCat = "FAIBLE";
      if (adxNow >= 40) adxCat = "TRÈS FORT";
      else if (adxNow >= 25) adxCat = "FORT";
      else if (adxNow >= 20) adxCat = "ÉMERGEANT";

      return {
        symbol:      sanitizeTicker(bundle.symbol),
        price,
        gapPct,
        volume:      Number(q.volume ?? 0),
        avgVol20,
        relVol,
        ema50,
        ema200,
        priceAboveEma50:  Number.isFinite(ema50)  && price > ema50,
        ema50AboveEma200: Number.isFinite(ema200) && Number.isFinite(ema50) && ema50 > ema200,
        adxNow,
        adxPrev,
        pDI,
        mDI,
        adxFort,
        adxUp,
        adxCat,
        sqzOnNow,
        sqzOffNow,
        sqzFreshExit,
      };
    }

    // =============================
    // SCORING v2
    // =============================
    function scoreRow(r){
      let score = 0;
      if (r.priceAboveEma50)    score += 2;  // Prix > EMA50
      if (r.ema50AboveEma200)   score += 2;  // EMA50 > EMA200
      if (r.relVol >= 1.5)      score += 2;  // Volume > 1.5x
      if (r.sqzOnNow)           score += 2;  // Squeeze actif
      if (r.sqzFreshExit)       score += 3;  // Sortie squeeze ≤3 bougies
      if (r.adxFort)            score += 2;  // ADX > 20
      if (r.adxUp)              score += 2;  // ADX ascendant
      return score;
    }

    function classifyRow(r){
      const score = scoreRow(r);
      let actionSignal, signalClass;
      if (score >= 12){
        actionSignal = "🟢 GO";
        signalClass  = "priority";
      } else if (score >= 10){
        actionSignal = "🟠 HOT";
        signalClass  = "hot";
      } else if (score >= 8){
        actionSignal = "🟡 WATCH";
        signalClass  = "watch";
      } else {
        actionSignal = "⚪ SKIP";
        signalClass  = "skip";
      }
      return { ...r, score, actionSignal, signalClass };
    }

    function marketStatusFromContext(rows){
      const spy = rows.find(r => r.symbol === "SPY");
      const qqq = rows.find(r => r.symbol === "QQQ");
      const avg = ((spy?.gapPct||0) + (qqq?.gapPct||0)) / 2;
      if (avg <= -0.6) return { key:"dead", icon:"🔴", text:"MARKET DEAD", sub:"Pré-market faible ou négatif." };
      if (avg <   0.4) return { key:"weak", icon:"🟡", text:"MARKET SLOW", sub:"Contexte mitigé, prudence." };
      return { key:"live", icon:"🟢", text:"MARKET LIVE", sub:"Contexte plutôt favorable." };
    }

    // =============================
    // RENDER
    // =============================
    function scoreBarColor(score){
      if (score >= 12) return "linear-gradient(90deg,#22c55e,#4ade80)";
      if (score >= 10) return "linear-gradient(90deg,#f97316,#fb923c)";
      if (score >= 8)  return "linear-gradient(90deg,#facc15,#fde047)";
      return "linear-gradient(90deg,#64748b,#94a3b8)";
    }

    function renderRow(r){
      const sqzPill = r.sqzFreshExit
        ? `<span class="pill orange">🔥 SQZ EXIT</span>`
        : r.sqzOnNow
          ? `<span class="pill yellow">🔴 SQZ ON</span>`
          : `<span class="pill">SQZ OFF</span>`;

      const adxPill = r.adxFort
        ? `<span class="pill ${r.adxUp ? "green" : "yellow"}">ADX ${r.adxCat} ${r.adxNow.toFixed(1)} ${r.adxUp ? "↗" : "→"}</span>`
        : `<span class="pill red">ADX FAIBLE ${r.adxNow.toFixed(1)}</span>`;

      const emaPill = r.priceAboveEma50 && r.ema50AboveEma200
        ? `<span class="pill green">EMA✅</span>`
        : r.priceAboveEma50
          ? `<span class="pill yellow">P>EMA50</span>`
          : `<span class="pill red">EMA❌</span>`;

      const volPill = r.relVol >= 1.5
        ? `<span class="pill green">VOL ${r.relVol.toFixed(1)}x</span>`
        : `<span class="pill">${r.relVol.toFixed(1)}x</span>`;

      const pct = Math.min(100, (r.score / 15) * 100);

      return `
        <div class="row">
          <div class="ticker">${r.symbol}</div>
          <div class="middle">
            <div class="meta">
              ${r.price.toFixed(2)}$ | Gap ${r.gapPct >= 0 ? "+" : ""}${r.gapPct.toFixed(1)}% | RSI—
            </div>
            <div class="meta">
              ${emaPill}${sqzPill}${adxPill}${volPill}
              <span class="pill blue">${r.score}/15</span>
            </div>
            <div class="score-bar-wrap">
              <div class="score-bar-fill" style="width:${pct}%;background:${scoreBarColor(r.score)}"></div>
            </div>
          </div>
          <div class="signal">${r.actionSignal}</div>
        </div>
      `;
    }

    function renderOutput(rows, market){
      const output = document.getElementById("output");

      const goRows    = rows.filter(r => r.actionSignal === "🟢 GO");
      const hotRows   = rows.filter(r => r.actionSignal === "🟠 HOT");
      const watchRows = rows.filter(r => r.actionSignal === "🟡 WATCH").slice(0, 5);
      const king      = goRows[0] || hotRows[0] || watchRows[0] || null;

      const noTrade = goRows.length === 0 && hotRows.length === 0 && watchRows.length === 0;

      output.innerHTML = `
        <div class="market-box ${market.key}">
          <div class="market-main">${market.icon} ${market.text}</div>
          <div class="market-sub">${market.sub}</div>
        </div>

        ${king ? `
          <div class="king-box">
            <div class="king-title">👑 KING OF THE DAY 👑</div>
            ${renderRow(king)}
            <div class="summary">Le plus propre du radar en ce moment.</div>
          </div>
        ` : `
          <div class="king-box">
            <div class="king-title">👑 KING OF THE DAY 👑</div>
            <div class="summary">Aucun KING ce matin. Contexte pas assez propre.</div>
          </div>
        `}

        ${noTrade ? `
          <div class="section-title">NO TRADE DAY</div>
          <div class="summary">
            Aucun titre ≥ 8 pts ce matin.<br>
            Structure trop faible — squeeze absent ou ADX plat.
          </div>
        ` : ""}

        ${goRows.length ? `
          <div class="section-title">🟢 PRIORITÉ — 12+ pts</div>
          ${goRows.map(renderRow).join("")}
        ` : ""}

        ${hotRows.length ? `
          <div class="section-title">🟠 TRÈS INTÉRESSANT — 10-11 pts</div>
          ${hotRows.map(renderRow).join("")}
        ` : ""}

        ${watchRows.length ? `
          <div class="section-title">🟡 À SURVEILLER — 8-9 pts</div>
          ${watchRows.map(renderRow).join("")}
        ` : ""}

        <div class="footnote">
          Scoring v2 : Structure EMA + Squeeze TTM + ADX tendance<br>
          Confirmation finale : UPV1 15M à 9h45
        </div>
      `;
    }

    // =============================
    // MAIN
    // =============================
    async function scanMarket(){
      const btn    = document.getElementById("scanBtn");
      const status = document.getElementById("status");
      const fill   = document.getElementById("progressFill");
      const output = document.getElementById("output");

      btn.disabled  = true;
      output.innerHTML = "";

      const allSymbols = [...new Set([...MARKET_SYMBOLS, ...UNIVERSE])];
      const total = allSymbols.length;

      try {
        if (!API_KEY || API_KEY.trim() === ""){
          throw new Error("Ajoute ta clé API FMP dans API_KEY.");
        }

        const bundles = await fetchMany(allSymbols, (done, tot) => {
          const pct = Math.round((done / tot) * 100);
          fill.style.width = pct + "%";
          status.textContent = `Scan en cours… ${done}/${tot} — ${allSymbols[done-1] || ""}`;
        });

        const rows = bundles
          .map(computeIndicators)
          .filter(Boolean)
          .map(classifyRow)
          .sort((a,b) => b.score - a.score);

        const market = marketStatusFromContext(rows);
        const stockRows = rows.filter(r => !MARKET_SYMBOLS.includes(r.symbol));
        const tradable  = stockRows.filter(r => r.score >= 8);

        renderOutput(stockRows, market);
        fill.style.width = "100%";
        status.textContent = `Scan terminé : ${stockRows.length} titres analysés — ${tradable.length} opportunités (≥8 pts).`;

      } catch(err){
        console.error(err);
        status.textContent = "Erreur pendant le scan.";
        output.innerHTML = `<div class="footnote" style="color:#fca5a5;">${String(err.message || err)}</div>`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
